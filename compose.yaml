services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: new_attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance
    ports:
      - '5433:5432'
    volumes:
      - attendance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U attendance -d new_attendance']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  attendance-postgres-data:
